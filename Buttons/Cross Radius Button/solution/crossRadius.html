<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross Radius Button | By Masum Billah</title>
  <style>
    :root {
      --font-family: 'Segoe UI', Tahoma, sans-serif; /* use this font*/
      /* Colors */
      --body-bg: hsl(225, 67%, 53%);
      --btn-bg: hsl(225, 75%, 47%);
      --btn-color: hsl(0, 0%, 95%);
      --btn-color-hover: hsl(0, 0%, 90%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--body-bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #btt {
      background-color: var(--btn-bg);
      color: var(--btn-color);
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 500;
      font-style: italic;
      letter-spacing: .35px;
      padding: .6rem 1.2rem;
      border: 2px solid var(--btn-color);
      border-radius: 1.7rem .35rem 1.7rem .35rem;
      transition: all 0.25s ease-in-out; /* apply transition */
    }

    #btt:hover {
      color: var(--btn-color-hover);
      border-radius: .35rem 1.7rem .35rem 1.7rem;
    }
  </style>
</head>

<body>
  <button id="btt">Cross Radius</button>
</body>

</html>
