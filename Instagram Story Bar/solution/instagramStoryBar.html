<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Story Bar | By Masum Billah</title>
  <style>
    :root {
      --pfp-size: 9rem; /* height and width */
      --font-family: 'Segoe UI', 'Open Sans';
      /* for seen story */
      --pfp-border-color: #595959;
      /* for unseen story */
      --pfp-border-gradient1: #F58529;
      --pfp-border-gradient2: #833AB4;
      --pfp-border-gradient3: #405DE6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { font-size: 62.5%; } /* 1rem set to 10px */

    body {
      background-color: hsl(0, 0%, 10%);
      height: 100vh;
      text-align: center;
    }

    .story-bar {
      padding-top: 4rem;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
    }

    .pfp {
      height: var(--pfp-size);
      width: var(--pfp-size);
      border-radius: 50%;
    }

    .pfp-border {
      position: relative;
      height: calc(var(--pfp-size) + .6rem); /* .6rem bigger than the image size */
      width: calc(var(--pfp-size) + .6rem);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pfp-border.new {
      background-image:
      linear-gradient(45deg,
      var(--pfp-border-gradient1),
      var(--pfp-border-gradient2),
      var(--pfp-border-gradient3));
    }

    .pfp-border.seen {
      background-color: var(--pfp-border-color);
    }

    .pfp-border.live::after {
      content: "Live";
      background-color: hsl(0, 100%, 43%);
      color: whitesmoke;
      font-family: var(--font-family);
      font-size: 1.2rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .77px;
      padding: .2rem .7rem;
      border-radius: .4rem;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%); /* transform to align at the center */
    }


    /* ADDING RESPONSIVENESS */
    @media (width < 610px) {
      :root { --pfp-size: 7.7rem; /* height and width */ }
    }

    @media (width < 530px) {
      :root { --pfp-size: 6.5rem; /* height and width */ }
      .story-bar { gap: 2rem; padding-top: 3rem; }
    }

    @media (width < 440px) {
      :root { --pfp-size: 5.5rem; /* height and width */ }
      .story-bar { gap: 1.5rem; }
    }

    @media (width < 370px) {
      :root { --pfp-size: 5rem; /* height and width */ }
      .story-bar { gap: 1rem; padding-top: 2rem; }
    }

    @media (width < 310px) {
      :root { --pfp-size: 4.3rem; /* height and width */ }
      .story-bar { gap: .65rem; }
    }

  </style>
</head>

<body>
  <div class="story-bar">
    <div class="pfp-border new">
      <img class="pfp" src="./Media/pfp1.jpg" alt="pfp1(404)">
    </div>

    <div class="pfp-border seen live">
      <img class="pfp seen" src="./Media/pfp2.jpg" alt="pfp2(404)">
    </div>

    <div class="pfp-border new">
      <img class="pfp" src="./Media/pfp3.jpg" alt="pfp3(404)">
    </div>

    <div class="pfp-border new live">
      <img class="pfp" src="./Media/pfp4.jpg" alt="pfp4(404)">
    </div>

    <div class="pfp-border seen">
      <img class="pfp" src="./Media/pfp5.jpg" alt="pfp5(404)">
    </div>
  </div>
</body>

</html>
